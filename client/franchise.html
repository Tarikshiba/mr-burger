<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Burger — Devenir franchise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="fade-in">
  <header class="topbar">
    <a href="index.html" class="logo-mark">Mr. <span>Burger</span></a>
    <a href="index.html" class="btn-ghost btn">← Menu</a>
  </header>

  <main class="tunnel">
    <h2 class="titre" style="text-align:center;">Rejoignez l'aventure Mr. Burger</h2>
    <p class="track-sub" style="text-align:center;margin-bottom:1.5rem;">Ouvrez votre franchise a Brazzaville ou Lome.</p>

    <div class="steps">
      <div class="step actif" data-step="1">1 · Profil</div>
      <div class="step" data-step="2">2 · Projet</div>
      <div class="step" data-step="3">3 · Capacite</div>
      <div class="step" data-step="4">4 · Experience</div>
    </div>

    <!-- Etape 1 : Presentation -->
    <section class="panneau actif" data-panneau="1">
      <div class="champ"><label>Prenom</label><input type="text" id="f-prenom" /></div>
      <div class="champ"><label>Nom</label><input type="text" id="f-nom" /></div>
      <div class="champ"><label>Email</label><input type="email" id="f-email" /></div>
      <div class="champ"><label>Telephone WhatsApp</label><input type="tel" id="f-whatsapp" placeholder="Format international, ex: 22890000000" /></div>
      <div class="tunnel-nav"><span></span><button class="btn" data-next="2">Continuer →</button></div>
    </section>

    <!-- Etape 2 : Projet -->
    <section class="panneau" data-panneau="2">
      <div class="champ"><label>Ville ciblee</label>
        <select id="f-ville">
          <option value="Brazzaville">Brazzaville</option>
          <option value="Lome">Lome</option>
          <option value="autre">Autre (preciser)</option>
        </select>
      </div>
      <div class="champ" id="champ-ville-libre" style="display:none;"><label>Precisez la ville</label><input type="text" id="f-ville-libre" /></div>
      <div class="champ"><label>Superficie envisagee (m2)</label><input type="number" id="f-superficie" placeholder="ex: 120" /></div>
      <div class="tunnel-nav"><button class="btn btn-ghost" data-prev="1">← Retour</button><button class="btn" data-next="3">Continuer →</button></div>
    </section>

    <!-- Etape 3 : Capacite -->
    <section class="panneau" data-panneau="3">
      <label style="font-weight:600;display:block;margin-bottom:.6rem;">Budget d'investissement disponible</label>
      <div class="radio-cards" style="grid-template-columns:1fr;">
        <div class="radio-card" data-budget="<10M">Moins de 10 000 000 FCFA</div>
        <div class="radio-card" data-budget="10-25M">10 000 000 – 25 000 000 FCFA</div>
        <div class="radio-card" data-budget=">25M">Plus de 25 000 000 FCFA</div>
      </div>
      <div class="tunnel-nav"><button class="btn btn-ghost" data-prev="2">← Retour</button><button class="btn" data-next="4">Continuer →</button></div>
    </section>

    <!-- Etape 4 : Experience -->
    <section class="panneau" data-panneau="4">
      <label style="font-weight:600;display:block;margin-bottom:.6rem;">Experience en restauration ?</label>
      <div class="radio-cards">
        <div class="radio-card actif" data-exp="non">Non</div>
        <div class="radio-card" data-exp="oui">Oui</div>
      </div>
      <div class="champ" id="champ-exp-detail" style="display:none;margin-top:1rem;"><label>Detaillez votre experience</label><textarea id="f-exp-detail" rows="3"></textarea></div>
      <div class="tunnel-nav"><button class="btn btn-ghost" data-prev="3">← Retour</button><button class="btn btn-vert" id="f-soumettre">Soumettre ma demande</button></div>
    </section>
  </main>

  <script src="../js/core.js"></script>
  <script src="../js/client.js"></script>
  <script>
    MrBurger.exigerVille();
    Client.initFranchise();
  </script>
</body>
</html>
