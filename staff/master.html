<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Burger — Hub Propriétaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background: var(--noir-profond); }

    .master-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem;
      background: rgba(13,13,13,.8);
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--bordure);
      position: sticky; top: 0; z-index: 40;
    }
    .master-header h1 { font-size: 1.4rem; }
    .master-header nav { display: flex; gap: .8rem; align-items: center; }

    .master-wrap {
      max-width: 1320px;
      padding: 2.5rem 2rem;
    }

    /* Section titles */
    .master-section-title {
      font-family: var(--font-titre);
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--bordure);
      color: var(--blanc);
    }

    /* KPIs premium */
    .cartes-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem; margin-bottom: 3rem;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 1.5rem 1.8rem;
      position: relative;
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .kpi:hover { border-color: var(--bordure-hover); box-shadow: var(--ombre); }
    .kpi::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--or), transparent);
      opacity: .6;
    }
    .kpi .val {
      font-size: 2rem; font-weight: 700; color: var(--or);
      margin-bottom: .2rem;
    }
    .kpi .lbl { color: var(--gris); font-size: .88rem; }

    /* Charts premium */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem; margin-bottom: 3rem;
    }
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 1.8rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .chart-box:hover { border-color: var(--bordure-hover); box-shadow: var(--ombre); }
    .chart-box h3 {
      font-size: .95rem;
      color: var(--gris-clair);
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    /* CRM Table premium */
    .crm-section { margin-top: 1rem; }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      background: var(--surface);
    }
    .table-crm {
      width: 100%; border-collapse: collapse;
      border: none; border-radius: 0;
    }
    .table-crm th {
      background: var(--surface-elevated);
      color: var(--gris);
      font-weight: 600;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 1rem 1.2rem;
    }
    .table-crm td {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--bordure);
      font-size: .92rem;
    }
    .table-crm tbody tr { transition: background var(--transition); }
    .table-crm tbody tr:hover { background: rgba(255,255,255,.02); }
    .table-crm tbody tr:last-child td { border-bottom: none; }
    .ligne-potentiel { background: var(--or-subtle); }
    .ligne-potentiel:hover { background: rgba(242,183,5,.12) !important; }

    /* Badge Fort Potentiel premium */
    .badge-or {
      background: linear-gradient(135deg, var(--or), #e0a800);
      color: #1a1300; font-weight: 700;
      padding: .3rem .7rem; border-radius: 999px; font-size: .7rem;
      box-shadow: 0 2px 10px var(--or-glow);
      text-transform: uppercase; letter-spacing: .04em;
      display: inline-block;
      animation: shimmer 2s ease infinite;
    }
    @keyframes shimmer {
      0%, 100% { box-shadow: 0 2px 10px var(--or-glow); }
      50% { box-shadow: 0 2px 20px rgba(242,183,5,.4); }
    }

    /* Bouton WhatsApp */
    .btn-whatsapp {
      display: inline-flex; align-items: center; gap: .4rem;
      background: #25D366; color: #fff;
      padding: .55rem 1rem; border-radius: 999px;
      font-weight: 600; font-size: .82rem;
      transition: transform var(--transition-fast), box-shadow var(--transition);
      text-decoration: none;
    }
    .btn-whatsapp:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 16px rgba(37,211,102,.3);
    }

    /* Bouton marquer contacte */
    .btn-contacte {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--bordure);
      color: var(--gris-clair);
      padding: .5rem .9rem; border-radius: 999px;
      font-weight: 600; font-size: .78rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-contacte:hover {
      background: rgba(3,140,62,.1);
      border-color: var(--vert);
      color: var(--vert);
    }

    /* Bouton WhatsApp direct (sans message) */
    .btn-wa-direct {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(37,211,102,.1);
      border: 1px solid rgba(37,211,102,.3);
      color: #25D366;
      padding: .5rem .9rem; border-radius: 999px;
      font-weight: 600; font-size: .78rem;
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    .btn-wa-direct:hover {
      background: #25D366; color: #fff;
      box-shadow: 0 4px 12px rgba(37,211,102,.3);
    }

    .crm-actions-cell {
      display: flex; gap: .5rem; align-items: center;
    }

    /* CRM vide */
    .crm-empty {
      text-align: center; padding: 3rem;
      color: var(--gris);
    }
    .crm-empty-icone { font-size: 2.5rem; margin-bottom: .8rem; opacity: .4; }

    @media (max-width: 768px) {
      .master-wrap { padding: 1.5rem 1rem; }
      .charts-grid { grid-template-columns: 1fr; }
      .cartes-kpi { grid-template-columns: repeat(2, 1fr); }
      .master-header { padding: .8rem 1rem; }
    }
  </style>
</head>
<body class="fade-in">
  <header class="master-header">
    <h1 class="logo-mark" style="font-size:1.4rem;">Hub <span>Propriétaire</span></h1>
    <nav>
      <a href="kds.html" class="btn btn-ghost">KDS</a>
      <a href="dispatch.html" class="btn btn-ghost">Dispatch</a>
      <button class="btn btn-ghost" id="deconnexion">Déconnexion</button>
    </nav>
  </header>

  <main class="master-wrap">
    <!-- KPIs -->
    <div class="cartes-kpi" id="kpis"></div>

    <!-- Analytics -->
    <h2 class="master-section-title">Analytics multi-sites</h2>
    <div class="charts-grid">
      <div class="chart-box">
        <h3>Chiffre d'affaires : Brazzaville vs Lomé</h3>
        <canvas id="chart-ca"></canvas>
      </div>
      <div class="chart-box">
        <h3>Ventes par catégorie</h3>
        <canvas id="chart-cat"></canvas>
      </div>
      <div class="chart-box">
        <h3>Temps moyen de préparation</h3>
        <canvas id="chart-temps"></canvas>
      </div>
    </div>

    <!-- CRM Franchise — Nouveaux -->
    <div class="crm-section">
      <h2 class="master-section-title">CRM — Nouvelles demandes</h2>
      <div class="table-wrap">
        <table class="table-crm">
          <thead><tr><th>Nom</th><th>Ville</th><th>Budget</th><th>Expérience</th><th>Date</th><th>Action</th></tr></thead>
          <tbody id="crm-body"></tbody>
        </table>
      </div>
    </div>

    <!-- CRM Franchise — Deja contactes -->
    <div class="crm-section" id="crm-contactes-section" style="display:none; margin-top:2.5rem;">
      <h2 class="master-section-title">Déjà contactés</h2>
      <div class="table-wrap">
        <table class="table-crm">
          <thead><tr><th>Nom</th><th>Ville</th><th>Budget</th><th>Date</th><th>Action</th></tr></thead>
          <tbody id="crm-contactes-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/core.js"></script>
  <script src="../js/staff.js"></script>
  <script>Staff.initMaster();</script>
</body>
</html>
